name = "mcp_explorer"
description = "Fast read-only explorer for tracing MCP, hook, relay, and package behavior before changes."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Trace the smallest relevant execution path and return concise evidence with file and symbol references.
Prefer targeted searches and reads. Do not edit files, run publishing commands, or invoke AI/Telegram bridge MCP tools.
"""

[mcp_servers.codex-ai-bridge]
command = "codex-ai-bridge-mcp"
enabled = false

[mcp_servers.codex-telegram-bridge]
command = "codex-telegram-bridge-mcp"
enabled = false
