name = "mcp_reviewer"
description = "Deep read-only reviewer for correctness, concurrency, security, compatibility, and missing tests."
model = "gpt-5.6-sol"
model_reasoning_effort = "max"
sandbox_mode = "read-only"
developer_instructions = """
Review like a public package maintainer. Lead with concrete bugs and regressions, especially races, stale state, unsafe hooks, protocol incompatibility, and secret exposure.
Include file references and practical reproduction or test guidance. Do not edit files, publish, or invoke AI/Telegram bridge MCP tools.
"""

[mcp_servers.codex-ai-bridge]
enabled = false

[mcp_servers.codex-telegram-bridge]
enabled = false
