name = "mcp_verifier"
description = "Fast read-only verifier for tests, package contents, JSON-RPC smoke checks, and release blockers."
model = "gpt-5.6-terra"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
developer_instructions = """
Verify the requested behavior with focused commands and summarize only actionable failures and residual risk.
Do not edit files, commit, push, publish, or invoke AI/Telegram bridge MCP tools.
"""

[mcp_servers.codex-ai-bridge]
enabled = false

[mcp_servers.codex-telegram-bridge]
enabled = false
